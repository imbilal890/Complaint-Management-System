<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 80px;
            max-width: 500px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
        }
        input {
            border-radius: 8px;
            padding: 10px;
        }
        .btn-success {
            border-radius: 8px;
            padding: 10px;
            width: 100%;
        }
        .result {
            margin-top: 15px;
            display: none;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h3 class="text-center text-primary mb-4">🔍 Track Complaint</h3>

        <div class="card">

            <p>Enter Complaint ID</p>

            <input type="text" id="cid" class="form-control mb-3" placeholder="e.g. CMP001">

            <button class="btn btn-success" onclick="track()">Track Status</button>

            <div id="result" class="result"></div>

        </div>

    </div>
    <div class="d-flex justify-content-center align-items-center" style="height: 10vh;">
        <a href="index.html" class="btn btn-primary px-4 py-1">
            Back to Home
        </a>

        <script>
            function track() {

                let id = document.getElementById("cid").value;
                let result = document.getElementById("result");

                if (id.trim() === "") {
                    alert("Please enter Complaint ID");
                    return;
                }

                let message = "";

                if (id === "CMP001") {
                    message = "🟡 Pending";
                    result.style.background = "#fff3cd";
                }
                else if (id === "CMP002") {
                    message = "🔵 In Progress";
                    result.style.background = "#cfe2ff";
                }
                else if (id === "CMP003") {
                    message = "🟢 Resolved";
                    result.style.background = "#d1e7dd";
                }
                else {
                    message = "❌ Complaint not found";
                    result.style.background = "#f8d7da";
                }

                result.innerHTML = message;
                result.style.display = "block";
            }
        </script>

</body>

</html>
